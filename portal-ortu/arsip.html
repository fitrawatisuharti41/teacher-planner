<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsip Materi — Portal Siswa &amp; Orang Tua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  body { display:flex; justify-content:center; min-height:100vh; padding: var(--space-8) var(--space-4); }
  .portal-shell { width:100%; max-width:560px; }
  .thumb { width:56px; height:56px; border-radius: var(--radius-sm); background: var(--color-accent-blue-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
</style>
</head>
<body>

<div class="portal-shell stack gap-6">
  <div class="row gap-3" style="justify-content:space-between;">
    <div>
      <strong id="namaSiswa"></strong>
      <div class="text-sm text-muted">Kelas <span id="kelasSiswa"></span></div>
    </div>
    <button class="btn btn-ghost" id="btnBackToMenu">← Menu</button>
  </div>

  <section class="card" id="materiSection">
    <p class="text-sm text-muted" id="materiEmpty" style="display:none;">Belum ada materi untuk kelas ini.</p>
  </section>
</div>

<script type="module">
  import { supabase } from '../js/config/supabase.js';

  document.getElementById('btnBackToMenu')?.addEventListener('click', () => {
    sessionStorage.clear();
    window.location.href = 'index.html';
  });

  const studentId = sessionStorage.getItem('portalStudentId');
  const nama = sessionStorage.getItem('portalNama');
  const kelasId = sessionStorage.getItem('portalKelasId');
  const kelasNama = sessionStorage.getItem('portalKelasNama');

  if (!studentId) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('namaSiswa').textContent = nama;
    document.getElementById('kelasSiswa').textContent = kelasNama;

    // Materi cuma relevan buat mapel+tingkat yang benar-benar diajarkan
    // guru ini di kelas siswa ini (misal siswa 8A cuma butuh liat materi
    // IPA Kelas 8, bukan IPA Kelas 7 atau Prakarya).
    const { data: assignment } = await supabase
      .from('teaching_assignments')
      .select('mapel, classes(tingkat)')
      .eq('kelas_id', kelasId)
      .limit(1)
      .maybeSingle();

    const mapel = assignment?.mapel;
    const tingkat = assignment?.classes?.tingkat;

    if (!mapel || !tingkat) {
      document.getElementById('materiEmpty').style.display = 'block';
    } else {
      const { data, error } = await supabase
        .from('resources')
        .select('judul, tipe, url, bab')
        .is('kategori', null)
        .eq('mapel_umum', mapel)
        .eq('tingkat_umum', tingkat)
        .order('created_at', { ascending: true });

      const renderItem = (r) => `
          <a class="row gap-3" href="${r.url || '#'}" target="_blank" rel="noopener" style="text-decoration:none; color:inherit;">
            <div class="thumb"><svg class="icon" style="color:var(--color-accent-blue)"><use href="../assets/icons/icons.svg#${r.tipe === 'video' ? 'icon-book' : 'icon-archive'}"/></svg></div>
            <div>
              <strong class="text-sm">${r.judul}</strong>
              <div class="text-xs text-muted">${r.tipe.toUpperCase()}</div>
            </div>
          </a>`;

      if (error || !data || data.length === 0) {
        document.getElementById('materiEmpty').style.display = 'block';
      } else {
        const babGroups = {};
        data.forEach((r) => {
          const key = r.bab || '(Tanpa Bab)';
          if (!babGroups[key]) babGroups[key] = [];
          babGroups[key].push(r);
        });

        const emoji = mapel === 'IPA' ? '📗' : '🧵';
        document.getElementById('materiSection').innerHTML = `
          <h3>${emoji} ${mapel} — Kelas ${tingkat}</h3>
          ${Object.entries(babGroups)
            .map(
              ([bab, items]) => `
            <div class="stack gap-3" style="margin-top:var(--space-4);">
              <strong class="text-sm">${bab}</strong>
              <div class="stack gap-3">${items.map(renderItem).join('')}</div>
            </div>`
            )
            .join('')}
        `;
      }
    }
  }
</script>
</body>
</html>
